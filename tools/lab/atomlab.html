<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hollowmere Atom Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Full-screen lab: the world fills the screen; the panel and inspector sit in the safe-area corners. */
:root{--panel:rgba(20,21,26,.86);--fg:#F2EEE2;--ok:#7BC47F;--bad:#E25B5B;--warn:#E9C53A;--cyan:#6FC3DF;--display:'Allerta Stencil',Impact,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#C3D19C;color:var(--fg);font:400 12px/1.5 var(--mono);-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#panel{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));width:min(330px,calc(100vw - 20px));max-height:calc(100% - 40px);overflow:auto;background:var(--panel);border-radius:12px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#panel.folded .body{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font:400 16px var(--display);letter-spacing:.06em;margin:0;text-transform:lowercase}
button,select,input{font:500 11px var(--mono);color:var(--fg);background:rgba(255,255,255,.08);border:1px solid rgba(242,238,226,.25);border-radius:6px;padding:5px 8px}
button[aria-pressed=true]{background:var(--fg);color:#1A1B20}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
#seed{width:70px}
h4{font:400 11px var(--display);letter-spacing:.1em;margin:10px 0 4px;color:#C9C3B2;text-transform:lowercase}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 10px;margin-top:8px}.kv span{color:#A9A397}
.val{list-style:none;margin:0;padding:0}.val li{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)}.val b{display:inline-block;width:16px}.val small{display:block;color:#A9A397;margin-left:16px}
.val .ok b{color:var(--ok)}.val .bad b{color:var(--bad)}.val .warn b{color:var(--warn)}
.stages{display:flex;flex-wrap:wrap;gap:4px}.stages span{background:rgba(255,255,255,.06);border-radius:4px;padding:2px 6px}.stages i{font-style:normal;color:var(--cyan);margin-left:4px}
#insp{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 20px));max-height:46%;overflow:auto;background:var(--panel);border-radius:12px;padding:8px 10px;border-left:3px solid var(--cyan)}
#insp pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font-size:11px}
.ih{display:flex;justify-content:space-between;align-items:center;gap:8px}
#pos{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-radius:999px;padding:4px 10px;font-size:11px;pointer-events:none}
#jb{position:fixed;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:rgba(20,21,26,.3);border:2px solid rgba(242,238,226,.5);pointer-events:none}
#jk{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:rgba(242,238,226,.85);transform:translate(-50%,-50%)}
input[type=range]{width:120px;accent-color:#F2EEE2;padding:0}
</style>
</head>
<body>
<canvas id="c" aria-label="Ashford Hollow built from atoms, seen from above"></canvas>
<div id="panel">
  <div class="top"><h1>hollowmere atom lab</h1><button id="fold" type="button">hide</button></div>
  <div class="body">
    <div class="row"><label for="seed">seed</label><button id="prev" type="button" aria-label="Previous seed">◀</button><input id="seed" type="number" min="0" inputmode="numeric"><button id="next" type="button" aria-label="Next seed">▶</button><button id="camp" type="button">camp</button></div>
    <div class="row"><label for="area">variant</label><select id="area"></select></div>
    <div class="row"><label for="pal">palette</label><select id="pal"></select><label for="zoom">view</label><input id="zoom" type="range" min="30" max="90" value="50"></div>
    <div class="row"><button type="button" data-ov="sockets" aria-pressed="false">sockets</button><button type="button" data-ov="lots" aria-pressed="false">lots</button><button type="button" data-ov="collision" aria-pressed="false">collision</button><button type="button" data-ov="nav" aria-pressed="false">nav</button></div>
    <div id="report"></div>
    <h4>how</h4><div>Drag on the left half to walk (push to the edge to run), WASD on a computer. Pinch or wheel to zoom 30–90 m. Tap any thing to inspect its atom.</div>
  </div>
</div>
<div id="insp" hidden></div>
<div id="pos"></div>
<div id="jb" hidden><div id="jk"></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
