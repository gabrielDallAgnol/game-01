<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hollowmere Looks Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* The Looks Lab: one Hollowmere scene (Kai, the camp, the dead marching in), four ways of drawing it. */
:root{--panel:rgba(14,15,19,.84);--fg:#F2EEE2;--dim:#9a988f;--amber:#F0B44C;--cyan:#6FE3FF;--red:#FF3B4E;--display:'Allerta Stencil',Impact,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#0b0c0f;color:var(--fg);font:400 12px/1.45 var(--mono);-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{pointer-events:none}
#top{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#title{font:400 13px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--panel);padding:4px;border-radius:12px;pointer-events:auto;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:calc(100vw - 20px)}
#tabs button{font:500 12px var(--mono);color:var(--dim);background:transparent;border:0;border-radius:9px;padding:8px 10px;cursor:pointer;white-space:nowrap}
#tabs button[aria-pressed=true]{background:#F2EEE2;color:#111}
#tabs button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100vw - 20px));background:var(--panel);border-radius:12px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#cap h2{font:400 15px var(--display);letter-spacing:.06em;margin:0 0 2px}
#cap p{margin:0;color:#d6d2c6}
#cap .tells{margin-top:4px;color:var(--amber)}
#cap.min p{display:none}
#bar{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px;pointer-events:none}
#bar button{pointer-events:auto;font:600 12px var(--mono);color:var(--fg);background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:44px}
#bar button.go{background:var(--amber);color:#1a1206;border-color:transparent}
#bar button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
#hint{position:fixed;right:10px;top:calc(92px + env(safe-area-inset-top,0px));color:var(--dim);font-size:11px;text-align:right;pointer-events:none;opacity:.8}
#err{position:fixed;inset:auto 10px 50% 10px;background:#3a0d12;color:#ffd9dd;padding:12px;border-radius:10px}
@media (max-width:420px){#tabs button{padding:8px 6px;font-size:11px}}
</style>
</head>
<body>
<canvas id="gl" aria-label="The Hollowmere scene, drawn in the selected look"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="top">
  <div id="title">Hollowmere · looks lab</div>
  <div id="tabs" role="group" aria-label="Look">
    <button data-look="today" aria-pressed="false">Today</button>
    <button data-look="ash" aria-pressed="false">Ash 1</button>
    <button data-look="ash2" aria-pressed="false">Ash 2</button>
    <button data-look="medium" aria-pressed="true">One medium</button>
    <button data-look="ash3" aria-pressed="false">Overgrown</button>
    <button data-look="print" aria-pressed="false">Print</button>
    <button data-look="system" aria-pressed="false">System</button>
    <button data-look="glyph" aria-pressed="false">Glyphs</button>
  </div>
</div>
<div id="hint">drag to walk Kai<br>pinch or scroll to zoom</div>
<section id="cap" aria-live="polite"><h2 id="capT"></h2><p id="capP"></p><p class="tells" id="capW"></p></section>
<div id="bar">
  <button id="zout" aria-label="Zoom out">−</button>
  <button id="wave" class="go">Send a march</button>
  <button id="night">Night</button>
  <button id="capBtn" aria-label="Hide the notes">Notes</button>
  <button id="zin" aria-label="Zoom in">+</button>
</div>
<div id="err" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="./looks.js"></script>
</body>
</html>
