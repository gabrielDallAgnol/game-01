<meta charset="utf-8">
<title>Hold Hollowmere</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Two styles only. The CAMP: Barlow Condensed, amber, tabular numbers, warm dark glass (what is yours).
   The SYSTEM: monospace, a cyan hairline frame with corner brackets, scanlines, navy glass (the window only you see).
   Phone first (390×844 in the Claude app): one merged top bar in the safe area, thumb actions at the bottom, the
   centre clear. At most three elements use backdrop-filter (the strip, the Camp bar, the dock bar). */
:root{
  --ink:#0c0e11; --bone:#efe7d6; --muted:#a59d8d; --dim:#7d776c; --line:rgba(239,231,214,.14);
  --amber:#f0a649; --amber-d:#d9843a; --ember:#ff7a45; --wheat:#d9c27a; --blood:#ff6a55; --good:#9fe08a; --rot:#b4ff4e;
  --camp-glass:rgba(22,17,12,.72); --camp-solid:rgba(20,16,12,.96);
  --cyan:#7fe3ff; --main:#ffd36a; --cyan-d:rgba(127,227,255,.55); --cyan-f:rgba(127,227,255,.16); --sys-text:#d9f4ff; --navy:#08131f;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;
  --ease-o:cubic-bezier(.2,.8,.2,1); --ease-b:cubic-bezier(.3,1.45,.5,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;margin:0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.ic{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em}
b,strong{font-weight:700}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--amber);color:#1f1407;font:700 17px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.btn:disabled{opacity:.42;cursor:default}
.btn.ghost{background:transparent;color:var(--bone);border:1px solid var(--line)}
.btn.big{min-height:52px;padding:0 26px;font-size:19px}
.btn.sm{min-height:36px;padding:0 12px;font-size:15px;position:relative}.btn.sm::after{content:"";position:absolute;inset:-4px}
.sysw .btn,.btn.sys{background:var(--cyan);color:#04121d;border-radius:2px;font:600 14px/1 var(--mono);letter-spacing:.1em}
.sysw .btn.ghost,.btn.sys.ghost{background:transparent;color:var(--cyan);border:1px solid var(--cyan-d)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(6px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.topbar{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;justify-items:stretch;min-width:0}
/* the System strip */
.sysbar{pointer-events:auto;position:relative;height:30px;display:flex;align-items:center;padding:0 10px;cursor:pointer;
  background:linear-gradient(180deg,rgba(10,24,40,.78),rgba(6,14,26,.82));border:1px solid var(--cyan-d);border-radius:2px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 0 18px rgba(60,170,255,.14),inset 0 0 0 1px rgba(127,227,255,.06);font:500 12.5px/1 var(--mono);color:var(--sys-text);overflow:hidden}
.sysbar::before,.sysbar::after{content:"";position:absolute;width:8px;height:8px;border:2px solid var(--cyan);pointer-events:none}
.sysbar::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.sysbar::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.sb-in{display:flex;align-items:center;gap:10px;width:100%;min-width:0}
.sb-hp{display:inline-flex;align-items:center;gap:4px;color:#ff9a8a}.sb-hp b{color:var(--sys-text);font-weight:600}.sb-hp i{font-style:normal;color:rgba(217,244,255,.5)}
.sysbar.low .sb-hp b{color:var(--blood)}
.sb-lv{color:var(--cyan)}.sb-lv b{color:var(--sys-text);font-weight:600}
.sb-hp,.sb-lv{flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-st{flex:none;display:flex;align-items:center;gap:10px}
.sysbar.two .sb-st{flex-direction:column;align-items:flex-start;gap:4px}
.sb-main{flex:1;min-width:0;border-left:1px solid var(--cyan-f);padding-left:10px;overflow:hidden}
.sb-q,.sb-say{display:block;overflow:hidden;text-overflow:ellipsis}
/* the quest: up to two lines, then an ellipsis; with a contract line under it, one line each */
.sb-t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;line-height:15px;overflow-wrap:anywhere}
.sysbar.two .sb-t{-webkit-line-clamp:1;display:block;white-space:nowrap;text-overflow:ellipsis}
.sb-q .sb-k{display:block;margin-top:2px;font-size:11px;line-height:13px;color:#7fe3ff;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sysbar{height:auto;min-height:30px;padding-top:4px;padding-bottom:4px}
#kSign{white-space:normal;line-height:1.25;text-align:center;max-width:100%}
.sb-q b{color:var(--cyan);font-weight:600;font-variant-numeric:tabular-nums}.sb-q b.ok{color:var(--good)}
.br{color:var(--cyan)}
.sysbar.speaking{border-color:var(--cyan);height:auto;min-height:30px;padding:6px 10px}.sysbar.speaking .sb-main{white-space:normal;line-height:17px}.sysbar.speaking .sb-say{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.sysbar.speaking .sb-say{color:#fff}
.sysbar.beat{animation:beat .9s var(--ease-o)}
.sysbar.bad{border-color:rgba(255,120,100,.8)}.sysbar.bad .br{color:#ff9a86}
@keyframes beat{0%{box-shadow:0 0 0 rgba(127,227,255,0)}25%{box-shadow:0 0 0 2px var(--cyan),0 0 36px rgba(127,227,255,.55)}100%{box-shadow:0 0 18px rgba(60,170,255,.14)}}
.caret{display:inline-block;width:.55em;height:1em;vertical-align:-.15em;background:var(--cyan);margin-left:1px;animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* the Camp bar */
.campbar{pointer-events:auto;display:flex;align-items:center;gap:2px;height:44px;padding:0 4px 0 2px;background:var(--camp-glass);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font:600 19px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.cb{display:inline-flex;align-items:center;gap:5px;height:44px;padding:0 7px;border:0;background:none;color:var(--bone);min-width:0}
.cb .ic{color:var(--amber);font-size:17px}
.cb b{font-weight:700}
.cb.day{padding-left:9px;gap:6px}.cb.day .ic{font-size:18px}.cb.day.night .ic{color:#bcd4ff}.cb.day.blood .ic{color:var(--blood)}
.cb.camp .meter{width:42px;height:6px;border-radius:3px;background:rgba(239,231,214,.14);overflow:hidden}
.cb.camp .meter i{display:block;height:100%;width:100%;background:var(--amber);transition:width .25s}
.cb.camp.hurt .meter i{background:var(--ember)}.cb.camp.low .meter i{background:var(--blood)}
.cb.res b{min-width:1.6ch}
.cb .warn{color:var(--blood)}
.cb.noise .nm{width:30px;height:6px;border-radius:3px;background:rgba(239,231,214,.14);position:relative;overflow:hidden}
.cb.noise .nm i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--good),var(--amber) 55%,var(--blood));background-size:30px 100%;transition:width .3s}
.cb.noise.hot .ic{color:var(--blood);animation:blink 1s steps(2) infinite}
.cb.more{margin-left:auto;width:40px;justify-content:center;color:var(--muted);padding:0}.cb.more .ic{color:var(--bone);font-size:20px}
.cbsep{width:1px;height:18px;background:var(--line);flex:none}
.campbar{min-width:0;overflow:hidden}.cb.res{flex:0 1 auto}
@media (max-width:400px){.campbar{font-size:18px}.cb{padding:0 5px;gap:4px}.cb .ic{font-size:16px}.cb.camp .meter{width:34px}.cb.noise .nm{width:24px}.cb.more{width:34px}}
/* tonight, honestly */
.forecast{justify-self:center;display:flex;align-items:center;gap:8px;max-width:100%;padding:0 4px;font:600 15px/20px var(--display);letter-spacing:.02em;color:var(--bone);text-shadow:0 1px 2px #000,0 0 8px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto}
.forecast .ic{color:var(--amber);font-size:15px}
.forecast .st{display:inline-flex;align-items:center;gap:5px}
.forecast .st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.forecast .st.risk::before{background:var(--amber);box-shadow:0 0 8px var(--amber)}.forecast .st.fall::before{background:var(--blood);box-shadow:0 0 8px var(--blood)}
.forecast .sep{color:var(--dim)}
.forecast.night{color:#cfe0ff;white-space:normal;text-align:center;justify-content:center}.forecast.night .ic{color:#bcd4ff}
.campaway{justify-self:end;max-width:100%;margin-top:-2px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:rgba(20,16,12,.86);border:1px solid var(--line);font:600 15px/1 var(--display);letter-spacing:.03em;pointer-events:none}
.campaway .ic{color:var(--amber)}.campaway b{font-variant-numeric:tabular-nums}.campaway.hit{border-color:var(--ember);animation:pulse 1.1s ease-in-out infinite}.campaway.hit b{color:var(--ember)}.campaway.low b{color:var(--blood)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(255,122,69,.18)}}
/* the thumb row */
#dock{display:grid;gap:8px;justify-items:center}
.bar{pointer-events:auto;display:flex;align-items:center;gap:10px;width:100%;max-width:560px;min-height:56px;padding:6px;background:var(--camp-glass);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
#buildBtn{min-height:44px;border-radius:22px;padding:0 16px 0 14px;font-size:18px}
#buildBtn .ic{font-size:18px}
#buildBtn[aria-expanded=true]{background:var(--bone);color:#1f1407}
#info{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;font:600 16px/20px var(--display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
#info .ic{color:var(--amber)}
#info em{font-style:normal;color:var(--rot)}#info em.hunt{color:#ff8a6a}
#info .soon{color:var(--ember)}#info .trip{color:var(--bone)}#info .trip.late{color:var(--blood)}
#info .erupt{color:#fff;background:var(--blood);border-radius:10px;padding:1px 8px}
.sundial{display:inline-flex;color:var(--bone)}.sundial .sun{fill:#ffd27a;filter:drop-shadow(0 0 3px #ffb347)}.sundial.soon .sun{fill:var(--ember)}.sundial.moon .sun{fill:#cfe0ff;filter:drop-shadow(0 0 3px #9fc0ff)}
.ability{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--dockH,72px) + 12px);width:68px;height:68px;border-radius:50%;
  background:conic-gradient(rgba(10,14,15,.72) calc(var(--cd,0) * 360deg),transparent 0),var(--amber);color:#1f1407;border:2px solid rgba(255,236,200,.55);display:grid;place-content:center;gap:2px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.ability .an{font:700 14px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;padding:0 6px}
.ability .ac{font:600 13px/1 var(--display);display:inline-flex;gap:3px;align-items:center;justify-content:center}
.ability.cool{background:conic-gradient(rgba(240,166,73,.35) calc(var(--cd,0) * 360deg),transparent 0),var(--camp-solid);color:var(--bone);border-color:var(--line)}
.ability.reveal{animation:reveal .7s var(--ease-b)}@keyframes reveal{0%{transform:scale(.2);opacity:0}100%{transform:none;opacity:1}}
#mini{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--dockH,72px) + 12px);width:68px;height:68px;border-radius:14px;border:1.5px solid rgba(255,236,200,.4);background:#0b0d0e;pointer-events:auto;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);image-rendering:pixelated}
/* panels and the build drawer (solid: no blur) */
#panel{pointer-events:auto;width:min(560px,100%);max-height:46vh;overflow:auto;background:var(--camp-solid);border:1px solid var(--line);border-radius:16px;padding:8px 12px 12px}
.phead{display:flex;align-items:center;flex-wrap:wrap;gap:0 8px;margin-bottom:6px}
#pEyebrow{flex-basis:100%;order:-1;font:600 12px/16px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.phead b{flex:1;min-width:0;font:700 22px/26px var(--display);text-transform:uppercase;letter-spacing:.02em}
.x{background:none;border:0;width:44px;height:44px;display:grid;place-items:center;color:var(--muted);font-size:20px}
.opts{display:grid;gap:8px}.opts.one,.opts.two{grid-template-columns:1fr}
@media (min-width:700px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{text-align:left;background:rgba(239,231,214,.05);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px;min-width:0;min-height:56px}
.opt:hover:not(:disabled){border-color:rgba(240,166,73,.6);background:rgba(240,166,73,.08)}.opt:disabled{opacity:.42;cursor:default}
.opt .nm{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 18px/22px var(--display);text-transform:uppercase;letter-spacing:.02em}
.opt .ds{font:400 14px/19px var(--body);color:var(--muted)}
.opt .ds b{color:var(--bone)}.opt .ds b.good{color:var(--good)}.opt .ds b.bad{color:#ff9a86}.opt.sure{border-color:#ff9a86;background:rgba(212,85,63,.18)}
.cost{display:inline-flex;align-items:center;gap:4px;font:700 16px/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums}
.stat{display:flex;gap:12px;flex-wrap:wrap;font:400 14px/19px var(--body);color:var(--muted);margin:0 0 8px}.stat b{color:var(--bone)}
.note{font:400 13px/18px var(--body);color:var(--muted)}
.tray{pointer-events:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(560px,100%);background:var(--camp-solid);border:1px solid var(--line);border-radius:16px;padding:12px}
.tray:not(.open){display:none}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:76px;background:rgba(239,231,214,.05);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.tb i{width:24px;height:24px;border-radius:5px;background:#8b6a46;flex:none}
.tb.farm i{background:#c9a948}.tb.tower i{background:#a9bccd;border-radius:50%}.tb.wall i{background:#6b5236;height:10px;margin:7px 0}.tb.workshop i{background:#7d8a96}.tb.market i{background:var(--amber)}.tb.generator i{background:#c94a3a}
.tb .tn{font:700 16px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.tb .cost{font-size:15px}.tb .tc{font:700 15px/1 var(--display);color:var(--rot)}
.tb.have{border-color:rgba(163,198,92,.55)}.tb.on{background:rgba(240,166,73,.22);border-color:var(--amber)}.tb[aria-disabled="true"]{opacity:.45}.tb.tech{border-style:dashed}
.builders{grid-column:1/-1;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;font:600 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.builders button{background:transparent;border:1px solid var(--line);color:var(--bone);border-radius:999px;min-height:34px;padding:0 12px;font:700 14px var(--display);text-transform:uppercase}.builders button[aria-pressed=true]{background:var(--amber);color:#1f1407;border-color:var(--amber)}
.place{pointer-events:auto;display:flex;align-items:center;gap:8px;width:min(560px,100%);background:var(--camp-solid);border:1px solid var(--amber);border-radius:28px;padding:6px 6px 6px 16px;font:600 16px/20px var(--display)}
#placeInfo{flex:1;min-width:0}#placeInfo .warn{color:#ff9a86}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}.dot.gold{background:var(--amber)}.dot.food{background:var(--wheat);border-radius:1px;transform:rotate(45deg)}
/* toasts of the Camp: one at a time, just above the thumb row */
#ctoasts{position:fixed;left:50%;bottom:calc(var(--dockH,72px) + 92px);transform:translateX(-50%);width:min(440px,calc(100% - 32px));display:grid;justify-items:center;pointer-events:none;z-index:6}
.ctoast{pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:100%;padding:8px 14px;border-radius:18px;background:rgba(20,16,12,.92);border:1px solid var(--line);font:600 16px/20px var(--display);letter-spacing:.02em;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:tin .22s var(--ease-o)}
.ctoast .ic{color:var(--amber);font-size:16px}.ctoast b{color:var(--amber)}
.ctoast.bad{border-color:rgba(255,106,85,.6)}.ctoast.bad .ic,.ctoast.bad b{color:var(--blood)}.ctoast.good{border-color:rgba(240,166,73,.5)}
.ctoast.out{opacity:0;transform:translateY(6px);transition:.2s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* callouts: tips anchored to what they explain */
#callouts{position:fixed;inset:0;pointer-events:none;z-index:7}
.callout{pointer-events:auto;position:fixed;display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;background:rgba(6,16,28,.96);border:1px solid var(--cyan-d);border-radius:2px;color:var(--sys-text);font:400 14px/19px var(--body);box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 18px rgba(60,170,255,.16);animation:tin .25s var(--ease-o)}
.callout::after{content:"";position:absolute;left:var(--ax,50%);bottom:-7px;width:12px;height:12px;margin-left:-6px;background:rgba(6,16,28,.96);border-right:1px solid var(--cyan-d);border-bottom:1px solid var(--cyan-d);transform:rotate(45deg)}
.callout.up::after{bottom:auto;top:-7px;transform:rotate(225deg)}
.callout .co-t{flex:1}.callout .co-x{color:var(--cyan);font-size:14px;margin-top:2px}
/* edge arrows */
#edge{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.ar{position:absolute;left:0;top:0;width:0;height:0}
.ar i{position:absolute;left:-9px;top:-7px;width:0;height:0;border-left:16px solid var(--rot);border-top:7px solid transparent;border-bottom:7px solid transparent;filter:drop-shadow(0 0 3px rgba(0,0,0,.6))}
.ar span{position:absolute;left:-40px;top:-9px;width:28px;text-align:center;font:700 14px/18px var(--display);color:var(--rot);text-shadow:0 0 3px #000}
.ar.big i{border-left-color:var(--blood);border-left-width:20px;border-top-width:9px;border-bottom-width:9px;top:-9px}
.ar.ploc i{border-left-color:var(--amber)}.ar.ploc span{color:var(--amber)}
/* objectives: MAIN = big gold arrow + a System chip (MAIN · what · how far); OPTIONAL = small and quiet */
.ar.main i{left:-12px;top:-11px;border-left:24px solid var(--main);border-top-width:11px;border-bottom-width:11px;filter:drop-shadow(0 0 6px rgba(255,211,106,.75)) drop-shadow(0 0 2px #000);animation:mainPulse 1.4s ease-in-out infinite}
.ar.main span{left:-116px;top:-21px;width:92px;display:grid;justify-items:center;gap:1px;padding:3px 0 4px;background:rgba(10,16,26,.9);border:1px solid var(--main);border-radius:6px;box-shadow:0 0 10px rgba(255,211,106,.35);text-shadow:none;color:#fff1c9;font:600 12px/14px var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.ar.main span b{display:block;padding:0 6px;border-radius:3px;background:var(--main);color:#1a1206;font:800 11px/14px var(--display);letter-spacing:.12em;text-transform:uppercase}
.ar.main span em{font-style:normal;max-width:88px;overflow:hidden;text-overflow:ellipsis}
.ar.opt i{left:-6px;top:-5px;border-left:11px solid rgba(214,222,226,.8);border-top-width:5px;border-bottom-width:5px;filter:drop-shadow(0 0 2px rgba(0,0,0,.7))}
.ar.opt span{left:-48px;top:-8px;width:40px;font:600 11px/16px var(--body);color:rgba(214,222,226,.85)}
@keyframes mainPulse{50%{filter:drop-shadow(0 0 12px rgba(255,211,106,.95)) drop-shadow(0 0 2px #000)}}
@media (prefers-reduced-motion:reduce){.ar.main i{animation:none}}
.ar.kontract{pointer-events:auto}

details.fold{margin:16px 0 4px;border-top:1px solid var(--cyan-f);padding-top:10px}details.fold summary{cursor:pointer;font:600 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);list-style:none}details.fold summary::-webkit-details-marker{display:none}

.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font:500 12px var(--mono);color:rgba(217,244,255,.6)}.statgrid b{display:block;font:600 17px/22px var(--mono);color:#fff}
.titles{display:flex;flex-wrap:wrap;gap:6px}.title{display:inline-flex;align-items:center;gap:5px;font:500 13px var(--mono);border:1px solid var(--cyan-d);color:#c9f0ff;border-radius:2px;padding:3px 8px}
.comps{display:grid;gap:8px}.comp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:rgba(127,227,255,.04);border:1px solid var(--cyan-f);padding:10px}

.path{display:grid;gap:6px}.pr{display:grid;grid-template-columns:100px 1fr 40px;align-items:center;gap:8px;font:500 13px var(--mono)}.pb{height:6px;background:rgba(127,227,255,.1);overflow:hidden}.pb i{display:block;height:100%;background:var(--fam)}.pr b{text-align:right;font-weight:600}

.aitog{display:flex;gap:8px;align-items:flex-start;font:400 14px/20px var(--body);color:#a9c4d2;white-space:normal}.aitog input{margin-top:3px}
.msgs{display:grid;gap:8px;max-height:42vh;overflow:auto;margin:8px 0}.msg{padding:8px 12px;border-radius:12px;font:400 15px/21px var(--body);max-width:86%}
.msg.user{justify-self:end;background:rgba(240,166,73,.16);border:1px solid rgba(240,166,73,.4)}.msg.assistant{justify-self:start;background:rgba(127,227,255,.06);border:1px solid var(--cyan-f)}.msg.typing{opacity:.6}
.say{display:flex;gap:8px}.say input{flex:1;min-width:0;background:#06101b;color:var(--bone);border:1px solid var(--cyan-f);border-radius:22px;padding:10px 14px;font:400 16px var(--body);-webkit-user-select:text;user-select:text}
.topics{display:flex;gap:8px;flex-wrap:wrap}

.mapwrap{overflow:auto;max-height:58vh;background:#0b0d0e;-webkit-overflow-scrolling:touch}.mapwrap canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
/* the quest list (Status) and the map's legend: MAIN first with a gold bar, OPTIONAL grouped and quiet */
.qlist{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}

.qlist .qmain{border-left-color:var(--main);background:linear-gradient(90deg,rgba(255,211,106,.14),rgba(255,211,106,.03));box-shadow:inset 0 0 0 1px rgba(255,211,106,.28)}

.qlist .qt{display:flex;align-items:center;gap:8px;font:600 11px/14px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#d8cfae}
.qlist .qt em{font-style:normal}.qlist .qt i{font-style:normal;text-transform:none;margin-left:auto;color:#fff1c9;font-variant-numeric:tabular-nums}
.qlist .qtag{padding:0 6px;border-radius:3px;background:var(--main);color:#1a1206;font:800 11px/15px var(--display);letter-spacing:.12em}
.qlist .qn{font:600 15px/20px var(--mono);color:#fff}
.qlist .qs{color:#cdd6da}
.qlist .qmain .qn{color:#fff1c9}

.qlist .qopt .qt{color:#9aa6ab}.qlist .qopt .qt i{color:#b9c3c7}.qlist .qopt .qn{font:500 14px/19px var(--body);color:#dfe5e8}.qlist .qopt .qs{font-size:12px;color:#9aa6ab}
.qlist .qnone{color:#9aa6ab;font-style:italic}
.qopt-h{margin:0 0 6px;font:600 12px/16px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#9aa6ab}
.lg-main{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:10px 0 2px;padding:6px 10px;border-left:4px solid var(--main);background:rgba(255,211,106,.1);font:600 13px var(--body);color:#fff1c9}

.lg-main span{display:inline-flex;align-items:center;gap:6px}.lg-main i{width:10px;height:10px;border-radius:50%;display:inline-block;border:2px solid}
.legend .lg-h{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#9aa6ab}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 4px;font:400 13px var(--body);color:#cfe0ea}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}.legend i.o{background:none;border:2px solid}
